[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kdb"
version = "0.1.0"
description = "Knot resurgence database for hyperbolic twist knots: perturbative series and Stokes data"
requires-python = ">=3.9"
dependencies = ["python-flint>=0.6", "sympy>=1.11", "mpmath>=1.3", "pyyaml>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
kdb = "kdb.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kdb = ["knots/*.yaml", "modules/*/*.json", "modules/*/*.yaml", "modules/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: high-order or private-data golden tests", "engine: external engine (sage, wolfram)"]
